# Sobe o MySQL 8.0 (e, opcionalmente, a API).
#
#   Só o banco (para rodar a API no seu Python):  docker compose up -d mysql
#   Banco + API juntos:                           docker compose up -d --build
#
# Na primeira vez, o MySQL executa automaticamente database/schema.sql e database/seed.sql.
# Para zerar o banco e começar de novo:           docker compose down -v

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: controle_atendimento
      MYSQL_USER: atendimento
      MYSQL_PASSWORD: atendimento
      TZ: America/Recife
    ports:
      - "3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uatendimento", "-patendimento"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      # dentro do Docker, o banco se chama "mysql" (nome do serviço), não "localhost"
      DATABASE_URL: mysql+pymysql://atendimento:atendimento@mysql:3306/controle_atendimento
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados_mysql:
